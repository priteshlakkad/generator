spring.application.name=generator

# Root directory (on the local filesystem) where HTML templates
# are stored, keyed by templateType.
pdf.templates.dir=./template-store

# Base URI that relative resource paths (images, stylesheets) in a template resolve
# against, so a template can reference your portal with e.g. src="/images/p.png".
# Leave blank to require absolute URLs.
pdf.render.base-uri=

# Bounds on fetching remote resources referenced by a template. Data for these URLs
# comes from the request payload, so one bad URL must not stall or fail a render.
pdf.render.connect-timeout-ms=3000
pdf.render.read-timeout-ms=5000
pdf.render.max-resource-bytes=5242880

# Fetched resources kept in memory. Line items in a large quotation usually repeat the
# same product images, so this turns hundreds of fetches into a handful.
pdf.render.cache-size=256

# Hosts allowed to serve remote resources; empty allows any host. Set this to your
# portal's host so payload-supplied URLs cannot reach arbitrary internal addresses.
# pdf.render.allowed-hosts=portal.example.com,cdn.example.com

# Optional local quotation images, named <CATALOGUE-CODE>.png/.jpg/.jpeg.
# Read on each preview; missing images fall through to bundled assets, content URL, then Jaquar logo.
pdf.render.images-dir=./image-store
